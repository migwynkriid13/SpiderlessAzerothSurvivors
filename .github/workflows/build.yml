name: Build Windows DLL

# The initial implementation is reviewed in a PR before its first build.
# Only a push to main creates binaries; PR and manual runs are deliberately absent.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 release
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Test asset preparation
        run: python -B -m unittest discover -s tools -p "test_*.py" -v

      - name: Build release binaries
        run: cmake --build build --config Release --parallel

      - name: Stage package
        run: cmake --install build --config Release --prefix package

      - name: Package binaries and SHA-256 checksums
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'package'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          @(
            "Commit: $env:BUILD_SHA"
            "Build: $env:BUILD_RUN_URL"
            'Platform: Windows x64'
            'Configuration: Release'
          ) | Set-Content -LiteralPath (Join-Path $package 'BUILD-INFO.txt') -Encoding utf8

          $fileChecksums = Get-ChildItem -LiteralPath $package -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $relativePath = [IO.Path]::GetRelativePath($package, $_.FullName).Replace('\', '/')
              "$hash  $relativePath"
            }
          $fileChecksums | Set-Content -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Encoding ascii

          $archiveName = "SpiderlessAzerothSurvivors-windows-x64-$env:BUILD_SHA.zip"
          $archivePath = Join-Path $dist $archiveName
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archivePath
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $archiveName" |
            Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpiderlessAzerothSurvivors-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
